name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip websocket-client==1.8.0 cryptography google-api-python-client google-auth pillow==12.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JavaScript UI tests
        run: |
          for test in rit_tank/test_ui_*.cjs; do node "$test"; done
          node --check rit_tank/receipt_archive.js
          node --check rit_tank/receipt_scanner.js
      - name: Prepare Home Assistant data directory
        run: sudo install -d -o "$USER" -g "$USER" /data
      - name: Run Python tests
        working-directory: rit_tank
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Fetch immutable pre-feature runtime for isolated rollback test
        uses: actions/checkout@v4
        with:
          ref: 8a4b991bd7a81f59c866bcf46cf188167ddb6acd
          path: legacy-34-02
          persist-credentials: false
      - name: Verify old 34.02 runtime opens an oil-enabled test database intact
        run: python tools/test_oil_legacy_rollback.py legacy-34-02/rit_tank/app.py
      - name: Compile runtime modules
        run: python -m py_compile rit_tank/app.py rit_tank/pdf_report.py rit_tank/report_validation.py rit_tank/google_places.py rit_tank/routing.py rit_tank/home_assistant.py rit_tank/trips.py rit_tank/assistant.py rit_tank/odometer_control.py rit_tank/receipt_archive.py rit_tank/receipt_recognition.py
      - name: Smoke-test runtime imports
        working-directory: rit_tank
        run: python -c "import app, pdf_report, report_validation, google_places, routing, home_assistant, trips, assistant, odometer_control, receipt_recognition; assert app.APP_VERSION == '34.02'; print('runtime imports OK')"
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD

  docker-build:
    name: Docker build and runtime validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build production image
        run: docker build --build-arg BUILD_VERSION=34.02 --build-arg BUILD_ARCH=amd64 -t rit-tank-ci ./rit_tank
      - name: Smoke-test standalone synthetic oil preview on loopback
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rit-oil-synthetic-ci"
          docker run -d --rm --name rit-oil-preview-ci \
            -e RIT_TANK_PREVIEW_PASSWORD=CI_ONLY_SYNTHETIC_PREVIEW_PASSWORD_2026 \
            -e SUPERVISOR_TOKEN= -e HASSIO_TOKEN= \
            -v "$PWD/preview/oil/start.py:/preview/start.py:ro" \
            -v "$RUNNER_TEMP/rit-oil-synthetic-ci:/data" \
            -p 127.0.0.1:18099:8099 rit-tank-ci python3 -B /preview/start.py
          trap 'docker rm -f rit-oil-preview-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:18099/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs rit-oil-preview-ci
            exit 1
          fi
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'X-Forwarded-Proto: https' \
            http://127.0.0.1:18099/api/maintenance/oil)
          test "$code" = "401"
          docker exec rit-oil-preview-ci python3 -B -c "import sqlite3,pathlib; p=pathlib.Path('/data'); c=sqlite3.connect(p/'rit_tank.db'); assert (p/'.synthetic-oil-preview-only').exists(); assert c.execute('SELECT COUNT(*) FROM events').fetchone()[0]==3; assert c.execute('SELECT amount_ml FROM oil_maintenance').fetchone()[0]==4200; print('isolated synthetic backend PASS')"
      - name: Build Railway synthetic preview image from repository root
        run: docker build -f preview/oil/Dockerfile.railway -t rit-oil-railway-ci .
      - name: Smoke-test the exact Railway preview image without public hosting
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rit-oil-railway-ci"
          docker run -d --rm --name rit-oil-railway-preview-ci -e RIT_TANK_PREVIEW_PASSWORD=CI_ONLY_RAILWAY_SYNTHETIC_PASSWORD_2026 -e SUPERVISOR_TOKEN= -e HASSIO_TOKEN= -v "$RUNNER_TEMP/rit-oil-railway-ci:/data" -p 127.0.0.1:18100:8099 rit-oil-railway-ci
          trap 'docker rm -f rit-oil-railway-preview-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:18100/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then docker logs rit-oil-railway-preview-ci; exit 1; fi
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'X-Forwarded-Proto: https' -H 'X-Ingress-Path: /fake-ingress' http://127.0.0.1:18100/api/maintenance/oil)
          test "$code" = "401"
          docker exec rit-oil-railway-preview-ci python3 -B -c "import sqlite3,pathlib; p=pathlib.Path('/data'); c=sqlite3.connect(p/'rit_tank.db'); assert (p/'.synthetic-oil-preview-only').exists(); assert c.execute('SELECT amount_ml FROM oil_maintenance').fetchone()[0]==4200; print('Railway synthetic preview image PASS')"
      - name: Verify packaged runtime files
        run: docker run --rm --entrypoint /bin/sh rit-tank-ci -c 'test -f /app/app.py && test -f /app/report_validation.py && test -f /app/pdf_report.py && test -f /app/google_places.py && test -f /app/routing.py && test -f /app/home_assistant.py && test -f /app/trips.py && test -f /app/assistant.py && test -f /app/odometer_control.py && test -f /app/receipt_archive.py && test -f /app/receipt_archive.js && test -f /app/receipt_scanner.js && test -f /app/receipt_recognition.py && test -f /app/run.sh'
      - name: Smoke-test runtime imports in production image
        run: docker run --rm --entrypoint python rit-tank-ci -c "import app, pdf_report, report_validation, google_places, routing, home_assistant, trips, assistant, odometer_control, receipt_recognition; assert app.APP_VERSION == '34.02'; print('runtime imports OK')"
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD

  mobile-ui:
    name: Mobile browser validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install websocket-client==1.8.0
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: iPhone and iPad regression flows
        run: |
          node tools/test_browser_v3100.cjs
          node tools/test_browser_v3200.cjs
          node tools/test_browser_v3300.cjs
          node tools/test_browser_v3311.cjs
          node tools/test_browser_v3312.cjs
          node tools/test_browser_v3313.cjs
          node tools/test_browser_v3314.cjs
          node tools/test_browser_v3315.cjs
          node tools/test_browser_v3316.cjs
          node tools/test_browser_v3317_corners.cjs
          node tools/test_browser_v3317_straighten.cjs
          node tools/test_browser_v3317_review.cjs
          node tools/test_browser_v3317_cancel.cjs
          node tools/test_browser_street_house.cjs
          node tools/test_browser_oil_history.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-33-mobile-ui
          path: test-results/
