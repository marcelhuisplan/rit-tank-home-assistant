name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip websocket-client==1.8.0 cryptography google-api-python-client google-auth
      - name: Prepare Home Assistant data directory
        run: sudo install -d -o "$USER" -g "$USER" /data
      - name: Run Python tests
        working-directory: rit_tank
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Compile runtime modules
        run: python -m py_compile rit_tank/app.py rit_tank/pdf_report.py rit_tank/google_places.py rit_tank/routing.py rit_tank/home_assistant.py rit_tank/trips.py rit_tank/assistant.py
      - name: Smoke-test runtime imports
        working-directory: rit_tank
        run: python -c "import app, pdf_report, google_places, routing, home_assistant, trips, assistant; assert app.APP_VERSION == '26.00'; print('runtime imports OK')"
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD

  docker-build:
    name: Docker build and runtime validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build production image
        run: docker build --build-arg BUILD_VERSION=26.00 --build-arg BUILD_ARCH=amd64 -t rit-tank-ci ./rit_tank
      - name: Verify packaged runtime files
        run: docker run --rm --entrypoint /bin/sh rit-tank-ci -c 'test -f /app/app.py && test -f /app/pdf_report.py && test -f /app/google_places.py && test -f /app/routing.py && test -f /app/home_assistant.py && test -f /app/trips.py && test -f /app/assistant.py && test -f /app/run.sh'
      - name: Smoke-test runtime imports in production image
        run: docker run --rm --entrypoint python rit-tank-ci -c "import app, pdf_report, google_places, routing, home_assistant, trips, assistant; assert app.APP_VERSION == '26.00'; print('runtime imports OK')"
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
