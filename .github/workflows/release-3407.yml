name: Publish Rit & Tank 34.07 (one time)

# A PR never publishes. Main must first pass the full CI workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  publish-34-06:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'marcelhuisplan/rit-tank-home-assistant' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rit-tank-34-06-release-once
      cancel-in-progress: false
    steps:
      - name: Checkout exactly the commit tested by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check approved PR merge and refuse changed code or repeat release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          APPROVED=2566e43896925973af08b44f909ee88cf033609f
          OLD_MAIN=c0abf0d9088885fc5d8a49ce481ecea535397d67
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$TESTED_SHA"
          read -r parent1 parent2 extra < <(git show -s --format=%P HEAD)
          test -z "${extra:-}"
          test "$parent1" = "$OLD_MAIN"
          gh api "repos/$GH_REPO/pulls/59" > approved-pr.json
          jq -e --arg target "$TESTED_SHA" --arg source "$parent2" \
            '(.merged == true) and (.merge_commit_sha == $target) and (.head.sha == $source)' \
            approved-pr.json > /dev/null
          git merge-base --is-ancestor "$APPROVED" "$parent2"
          test "$(git rev-parse "$APPROVED:rit_tank")" = "$(git rev-parse HEAD:rit_tank)"
          git diff --name-only "$APPROVED" "$parent2" > supplementary-files.txt
          if grep -Ev '^([.]github/workflows/(ci[.]yml|release-3407[.]yml)|tools/release_3407[.]py)$' supplementary-files.txt; then
            echo 'Unexpected changes since the approved 34.07 month navigator and oil choices candidate'; exit 1
          fi
          grep -Fqx "APP_VERSION = '34.07'" <(grep '^APP_VERSION =' rit_tank/app.py)
          grep -Fqx "version: '34.07'" <(grep '^version:' rit_tank/config.yaml)
          if gh release view v34.07 >/dev/null 2>&1; then
            echo 'Release v34.07 already exists. Refusing to overwrite or republish.'; exit 1
          fi
          if git ls-remote --tags origin refs/tags/v34.07 | grep -q .; then
            echo 'Tag v34.07 already exists. Refusing to move or reuse.'; exit 1
          fi

      - name: Build and validate release ZIP from tested merged code
        run: python3 tools/release_3407.py --package

      - name: Publish 34.07 on GitHub only (never Home Assistant)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes-3407.md <<'NOTES'
          Rit & Tank 34.07 — Maandnavigatie en oliepeilkeuzes

          Blader in het financieel overzicht terug en vooruit tussen
          geregistreerde maanden. Het huidige jaar toont een afzonderlijk
          totaalsaldo tot en met vandaag. Volle-tankcycli worden gebruikt
          voor een indicatieve toerekening van zakelijke brandstofkosten;
          fiscale PDF/CSV blijft onveranderd.

          Leg bij Peil gecontroleerd de uitkomst vast via een vaste
          keuzelijst, met ruimte voor een extra eigen toelichting. Eerdere
          oliepeilcontroles blijven behouden; alleen een optionele
          statuskolom is veilig toegevoegd.

          Bestaande ritten, kilometers, tankbeurten, olieonderhoud, bonnen,
          instellingen en back-ups blijven behouden. Deze GitHub-release
          installeert zichzelf niet: behoud de volledige Home Assistant
          back-up en klik later zelf op Bijwerken. De echte herstelproef
          blijft open.
          NOTES
          gh release create v34.07 \
            'rit-tank-34.07-local-addon.zip#Rit & Tank 34.07 — lokale Home Assistant-add-on' \
            --target "$TESTED_SHA" \
            --title 'Rit & Tank 34.07 — Maandnavigatie en oliepeilkeuzes' \
            --notes-file release-notes-3407.md \
            --latest

      - name: Confirm official release and asset are available and identical
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v34.07 --json name,tagName,isDraft,isPrerelease,targetCommitish,assets,url > release.json
          jq -e --arg sha "$TESTED_SHA" \
            '.tagName == "v34.07" and (.isDraft == false) and (.isPrerelease == false) and
             (.targetCommitish == $sha) and
             (any(.assets[]; .name == "rit-tank-34.07-local-addon.zip" and .size > 1000))' \
            release.json > /dev/null
          git fetch --no-tags origin refs/tags/v34.07:refs/tags/v34.07
          test "$(git rev-list -n 1 v34.07)" = "$TESTED_SHA"
          mkdir -p release-download-verification
          gh release download v34.07 --pattern 'rit-tank-34.07-local-addon.zip' --dir release-download-verification
          cmp -s rit-tank-34.07-local-addon.zip release-download-verification/rit-tank-34.07-local-addon.zip
          echo 'OFFICIAL_34_07_RELEASE_AND_PACKAGE_VERIFIED'
          jq -r '.url' release.json
