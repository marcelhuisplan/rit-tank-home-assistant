name: Publish Rit & Tank 34.05 (one time)

# A PR never publishes. Main must first pass the full CI workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  publish-34-04:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'marcelhuisplan/rit-tank-home-assistant' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rit-tank-34-04-release-once
      cancel-in-progress: false
    steps:
      - name: Checkout exactly the commit tested by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check approved PR merge and refuse changed code or repeat release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          APPROVED=d86e961aa030a59d38e35cff56fa6e383ded085a
          OLD_MAIN=8bd51b6f45e3d739b0cc12d42acb009f7d123137
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$TESTED_SHA"
          read -r parent1 parent2 extra < <(git show -s --format=%P HEAD)
          test -z "${extra:-}"
          test "$parent1" = "$OLD_MAIN"
          gh api "repos/$GH_REPO/pulls/57" > approved-pr.json
          jq -e --arg target "$TESTED_SHA" --arg source "$parent2" \
            '(.merged == true) and (.merge_commit_sha == $target) and (.head.sha == $source)' \
            approved-pr.json > /dev/null
          git merge-base --is-ancestor "$APPROVED" "$parent2"
          test "$(git rev-parse "$APPROVED:rit_tank")" = "$(git rev-parse HEAD:rit_tank)"
          git diff --name-only "$APPROVED" "$parent2" > supplementary-files.txt
          if grep -Ev '^([.]github/workflows/(ci[.]yml|release-3405[.]yml)|tools/release_3405[.]py)$' supplementary-files.txt; then
            echo 'Unexpected changes since the approved 34.05 tankstop candidate'; exit 1
          fi
          grep -Fqx "APP_VERSION = '34.05'" <(grep '^APP_VERSION =' rit_tank/app.py)
          grep -Fqx "version: '34.05'" <(grep '^version:' rit_tank/config.yaml)
          if gh release view v34.05 >/dev/null 2>&1; then
            echo 'Release v34.05 already exists. Refusing to overwrite or republish.'; exit 1
          fi
          if git ls-remote --tags origin refs/tags/v34.05 | grep -q .; then
            echo 'Tag v34.05 already exists. Refusing to move or reuse.'; exit 1
          fi

      - name: Build and validate release ZIP from tested merged code
        run: python3 tools/release_3405.py --package

      - name: Publish 34.05 on GitHub only (never Home Assistant)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes-3405.md <<'NOTES'
          Rit & Tank 34.05 — Eigen tabblad Olie

          Motorolieonderhoud is direct bereikbaar via het tabblad Olie:
          Overzicht | Ritten | Tanken | Olie | Meer.
          Registreer olie bijvullen of verversen met datum, olietype,
          aantal milliliters, onderhoudskilometerstand en optionele opmerking.
          Bekijk, wijzig en verwijder oliebeurten met bevestiging.

          Bestaande oliebeurten blijven behouden. De bestaande olietabel
          is alleen achterwaarts compatibel uitgebreid met een notitieveld.
          Tanken, automatische tankstops, ritten, kilometerstand,
          vergoeding en tankbonnen blijven gescheiden en behouden.

          De Home Assistant app blijft dezelfde repository en slug rit_tank
          gebruiken. Deze GitHub-release installeert zichzelf NIET.
          Controleer de volledige Home Assistant-back-up voordat je zelf
          via Bijwerken de update start. Een echte herstelproef en
          fysieke iPhone/PWA-test blijven nog open.
          NOTES
          gh release create v34.05 \
            'rit-tank-34.05-local-addon.zip#Rit & Tank 34.05 — lokale Home Assistant-add-on' \
            --target "$TESTED_SHA" \
            --title 'Rit & Tank 34.05 — Eigen tabblad Olie' \
            --notes-file release-notes-3405.md \
            --latest

      - name: Confirm official release and asset are available and identical
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v34.05 --json name,tagName,isDraft,isPrerelease,targetCommitish,assets,url > release.json
          jq -e --arg sha "$TESTED_SHA" \
            '.tagName == "v34.05" and (.isDraft == false) and (.isPrerelease == false) and
             (.targetCommitish == $sha) and
             (any(.assets[]; .name == "rit-tank-34.05-local-addon.zip" and .size > 1000))' \
            release.json > /dev/null
          git fetch --no-tags origin refs/tags/v34.05:refs/tags/v34.05
          test "$(git rev-list -n 1 v34.05)" = "$TESTED_SHA"
          mkdir -p release-download-verification
          gh release download v34.05 --pattern 'rit-tank-34.05-local-addon.zip' --dir release-download-verification
          cmp -s rit-tank-34.05-local-addon.zip release-download-verification/rit-tank-34.05-local-addon.zip
          echo 'OFFICIAL_34_05_RELEASE_AND_PACKAGE_VERIFIED'
          jq -r '.url' release.json
