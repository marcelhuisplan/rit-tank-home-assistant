name: Hotfix mobile check

on:
  push:
    branches: [hotfix/mobile-trip-modal-layout]

jobs:
  mobile-hotfix:
    name: Mobile hotfix regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install websocket-client==1.8.0
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Run targeted mobile regression
        run: node tools/test_browser_v3300.cjs
